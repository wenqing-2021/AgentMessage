# Copy to config/projects.toml and replace every example path.
# App IDs may appear in the bot registry below; Secrets do not belong here.
# Set AGENT_MESSAGE_FEISHU_APP_ID and
# AGENT_MESSAGE_FEISHU_APP_SECRET in a chmod-600 environment file instead.

[service]
state_dir = "var"
log_dir = "var/logs"
default_chat_project = "agent_message"
# Set true only for trusted projects where Codex-generated tools may use the network.
codex_tool_network = true
stop_grace_seconds = 10
final_message_limit = 3500
# Global commit identity shared by every bubblewrap sandbox project:
# sandbox_git_user_name = "Alice"
# sandbox_git_user_email = "alice@example.com"
# Global dedicated SSH agent shared by every bubblewrap sandbox project; both absolute paths are required. No private keys are mounted.
# sandbox_ssh_agent_socket = "/run/user/1000/agent-message-ssh/agent.sock"
# sandbox_ssh_known_hosts = "/home/alice/.ssh/known_hosts"
# sandbox_readonly_paths = ["/opt/quarto", "/etc/fonts"]

[projects.agent_message]
path = "/home/alice/workspace/agent_message"
default_agent = "codex"
allowed_agents = ["codex"]
# Optional bubblewrap sandbox through AgentMessage's sandbox MCP. Project commands,
# including Git writes, run through sandbox_run; add sandbox_gpu for CUDA/JAX work:
# sandbox_enabled = true
# sandbox_gpu = false
# sandbox_network = true
# sandbox_timeout_seconds = 86400

# Existing Docker container execution. The host path must already be bind-mounted at
# container_path in the named container; docker inspect verifies this mapping before each run.
[projects.container_project]
path = "/home/alice/workspace/container_project"
default_agent = "codex"
allowed_agents = ["codex"]
container_name = "container_project_dev"
container_path = "/workspace/container_project"
container_auto_start = true
container_timeout_seconds = 86400

# Optional shared-code multi-bot setup. App IDs are public identifiers; Secrets stay
# in separate chmod-600 environment files. Add feishu_app_id = "cli_primary" to
# [service], then uncomment these tables. Each project belongs to one bot; project
# paths assigned to different bots must not overlap. Existing single-bot configs
# continue to work without any of these entries.
# [bots.cli_primary]
# projects = ["agent_message"]
# default_chat_project = "agent_message"
#
# [bots.cli_second]
# projects = ["container_project"]
# default_chat_project = "container_project"
